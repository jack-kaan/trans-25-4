                const viewportWidth = (typeof window !== "undefined" && window.innerWidth) ? window.innerWidth : 1440;
                const viewportHeight = (typeof window !== "undefined" && window.innerHeight) ? window.innerHeight : 900;
                const left = Math.min(Math.max(margin, Number(networkOneHopPicker.x || 0) + 12), Math.max(margin, viewportWidth - popupWidth - margin));
                const top = Math.min(Math.max(margin, Number(networkOneHopPicker.y || 0) + 12), Math.max(margin, viewportHeight - popupHeight - margin));
                return { left, top };
            }, [networkOneHopPicker]);
            React.useEffect(() => {
                if (!networkOneHopPicker) return undefined;
                const handleOutsidePointer = (event) => {
                    const target = event.target;
                    if (target?.closest?.("[data-network-doc-picker='true']")) return;
                    setNetworkOneHopPicker(null);
                };
                window.addEventListener("pointerdown", handleOutsidePointer);
                return () => window.removeEventListener("pointerdown", handleOutsidePointer);
            }, [networkOneHopPicker]);
            const openNetworkV2ExternalReference = (node) => {
                const targetUrl = resolveReferenceNodePriorityUrl(node || {});
                if (!targetUrl) return;
                try {
                    window.open(targetUrl, "_blank", "noopener,noreferrer");
                } catch (err) {
                    console.warn("Network node open failed:", err);
                }
            };
            const openNetworkV2HistoryDoc = (docId) => {
                const normalizedDocId = String(docId || "");
                if (!normalizedDocId) return;
                const matchedDoc = history.find((item) => String(item?.id || "") === normalizedDocId);
                if (!matchedDoc) return;
                setActiveTab("translate");
                setActiveId(matchedDoc.id);
                closeClassificationMode();
                setMinWin2(false);
                setMinWin3(false);
                setMinWin5(false);
                setShowNodeWindow(true);
                updateDocAnalysisUi(matchedDoc.id, (prev) => ({
                    ...prev,
                    panelHidden: false,
                    panelCollapsed: false
                }));
                setNetworkOneHopPicker(null);
            };
            React.useEffect(() => {
                networkNodeDraggingRef.current = networkNodeDragging;
            }, [networkNodeDragging]);
            React.useEffect(() => {
                if (!networkPinnedNode) return undefined;
                const handleOutsidePointer = (event) => {
                    const target = event.target;
                    if (target?.closest?.("[data-network-interactive='true']")) return;
                    if (target?.closest?.("[data-network-pinned-box='true']")) return;
                    if (target?.closest?.("[data-network-doc-picker='true']")) return;
                    setNetworkPinnedNode(null);
                };
                const handleEscape = (event) => {
                    if (event.key !== "Escape") return;
                    setNetworkPinnedNode(null);
                    setNetworkOneHopPicker(null);
                };
                window.addEventListener("pointerdown", handleOutsidePointer);
                window.addEventListener("keydown", handleEscape);
                return () => {
                    window.removeEventListener("pointerdown", handleOutsidePointer);
                    window.removeEventListener("keydown", handleEscape);
                };
            }, [networkPinnedNode]);
            const shouldSuppressNetworkV2Click = () => Boolean(networkRuntimeRef.current?.moved || networkPointer?.moved || networkNodeDraggingRef.current?.moved);
            const openNetworkV2OneHopAction = (node, event) => {
                const rows = Array.isArray(node?.docDisplayRows) ? node.docDisplayRows : [];
                if (rows.length <= 1) {
                    const docId = rows[0]?.docId || node?.docIds?.[0];
                    if (docId) openNetworkV2HistoryDoc(docId);
                    return;
                }
                setNetworkOneHopPicker({
                    nodeId: node.id,
                    label: node.displayLabel || node.label,
                    x: Number(event?.clientX || 0),
                    y: Number(event?.clientY || 0),
                    docRows: rows
                });
            };
            const handleNetworkV2NodeClick = (node, event) => {
                if (!node || shouldSuppressNetworkV2Click()) return;
                const samePinned = Boolean(
                    networkPinnedNode
                    && String(networkPinnedNode.nodeId || "") === String(node.id || "")
                    && String(networkPinnedNode.nodeType || "") === String(node.nodeType || "")
                );
                if (!samePinned) {
                    setNetworkOneHopPicker(null);
                    setNetworkPinnedNode({
                        nodeId: node.id,
                        nodeType: node.nodeType,
                        x: Number(event?.clientX || 0),
                        y: Number(event?.clientY || 0),
                        payload: node
                    });
                    return;
                }
                if (node.nodeType === "onehop") {
                    openNetworkV2OneHopAction(node, event);
                    return;
                }
                if (node.nodeType === "twohop") {
                    openNetworkV2ExternalReference(node);
                    return;
                }
            };
            const applyNetworkV2ZoomAtClient = (zoomFactor, clientX = null, clientY = null) => {
                const rect = networkCanvasRef.current?.getBoundingClientRect?.();
                setNetworkViewport((prev) => {
                    const nextScale = clampNetworkV2Scale(Number(prev.scale || 1) * Number(zoomFactor || 1));
                    if (Math.abs(nextScale - Number(prev.scale || 1)) < 0.0001) return prev;
                    if (!rect || rect.width <= 0 || rect.height <= 0) {
                        return { ...prev, scale: nextScale };
                    }
                    const ratioX = Number(networkDisplayGraphData.canvasWidth || 1) / rect.width;
                    const ratioY = Number(networkDisplayGraphData.canvasHeight || 1) / rect.height;
                    const anchorClientX = Number.isFinite(Number(clientX)) ? Number(clientX) : (rect.left + (rect.width / 2));
                    const anchorClientY = Number.isFinite(Number(clientY)) ? Number(clientY) : (rect.top + (rect.height / 2));
                    const anchorX = (anchorClientX - rect.left) * ratioX;
                    const anchorY = (anchorClientY - rect.top) * ratioY;
                    const prevScale = Number(prev.scale || 1);
                    const worldX = (anchorX - Number(prev.tx || 0)) / prevScale;
                    const worldY = (anchorY - Number(prev.ty || 0)) / prevScale;
                    return {
                        scale: nextScale,
                        tx: anchorX - (worldX * nextScale),
                        ty: anchorY - (worldY * nextScale)
                    };
                });
            };
            const handleNetworkV2Wheel = (e) => {
                if (!isNetworkTab) return;
                if (e?.defaultPrevented) return;
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.14 : (1 / 1.14);
                applyNetworkV2ZoomAtClient(zoomFactor, e.clientX, e.clientY);
            };
            const handleNetworkV2ZoomIn = () => applyNetworkV2ZoomAtClient(1.14);
            const handleNetworkV2ZoomOut = () => applyNetworkV2ZoomAtClient(1 / 1.14);
            const handleNetworkV2ZoomReset = () => setNetworkViewport({ scale: 1, tx: 0, ty: 0 });
            React.useEffect(() => {
                if (!isNetworkTab) return;
                const canvas = networkCanvasContainerRef.current || networkCanvasRef.current;
                if (!canvas) return;
                const onWheel = (e) => handleNetworkV2Wheel(e);
                canvas.addEventListener("wheel", onWheel, { passive: false });
                return () => canvas.removeEventListener("wheel", onWheel);
            }, [isNetworkTab, handleNetworkV2Wheel]);
            const startNetworkV2NodeDrag = (event, node) => {
                if (!node) return;
                if (event.button !== 0) return;
                event.stopPropagation();
                if (networkSuppressClickTimerRef.current) {
                    clearTimeout(networkSuppressClickTimerRef.current);
                    networkSuppressClickTimerRef.current = null;
                }
                const startX = Number(event.clientX || 0);
                const startY = Number(event.clientY || 0);
                const nextDragging = {
                    nodeId: String(node.id || ""),
                    nodeType: String(node.nodeType || ""),
                    pointerId: event.pointerId,
                    startX,
                    startY,
                    baseX: Number(node.x || 0),
                    baseY: Number(node.y || 0),
                    moved: false
                };
                networkNodeDraggingRef.current = nextDragging;
                setNetworkNodeDragging(nextDragging);
                if (networkCanvasRef.current?.setPointerCapture) {
                    try { networkCanvasRef.current.setPointerCapture(event.pointerId); } catch { }
                }
            };
            const handleNetworkV2PointerDown = (e) => {
                if (e.button !== 0) return;
                if (e.target?.closest?.("[data-network-interactive='true']")) return;
                const vp = networkViewportRef.current || { scale: 1, tx: 0, ty: 0 };
                const runtime = networkRuntimeRef.current;
                runtime.panning = true;
                runtime.pointerId = e.pointerId;
                runtime.startX = Number(e.clientX || 0);
                runtime.startY = Number(e.clientY || 0);
                runtime.startTx = Number(vp.tx || 0);
                runtime.startTy = Number(vp.ty || 0);
                runtime.moved = false;
                if (networkSuppressClickTimerRef.current) {
                    clearTimeout(networkSuppressClickTimerRef.current);
                    networkSuppressClickTimerRef.current = null;
                }
                setNetworkPanning(true);
                setNetworkPointer({
                    pointerId: e.pointerId,
                    startX: runtime.startX,
                    startY: runtime.startY,
                    startTx: runtime.startTx,
                    startTy: runtime.startTy,
                    moved: false
                });
                setNetworkOneHopPicker(null);
                if (networkCanvasRef.current?.setPointerCapture) {
                    try { networkCanvasRef.current.setPointerCapture(e.pointerId); } catch { }
                }
            };
            const handleNetworkV2PointerMove = (e) => {
                const dragging = networkNodeDraggingRef.current;
                if (dragging && dragging.pointerId === e.pointerId) {
                    const rect = networkCanvasRef.current?.getBoundingClientRect?.();
                    if (!rect || rect.width <= 0 || rect.height <= 0) return;
                    const ratioX = Number(networkDisplayGraphData.canvasWidth || 1) / rect.width;
                    const ratioY = Number(networkDisplayGraphData.canvasHeight || 1) / rect.height;
                    const scale = Math.max(0.35, Number(networkViewportRef.current?.scale || 1));
                    const dx = ((Number(e.clientX || 0) - Number(dragging.startX || 0)) * ratioX) / scale;
                    const dy = ((Number(e.clientY || 0) - Number(dragging.startY || 0)) * ratioY) / scale;
                    const distance = Math.hypot(dx, dy);
                    const moved = Boolean(dragging.moved || distance > 4);
                    const nextDragging = { ...dragging, moved };
                    networkNodeDraggingRef.current = nextDragging;
                    if (moved !== dragging.moved) {
                        setNetworkNodeDragging((prev) => prev ? { ...prev, moved } : prev);
                    }
                    if (!moved) return;
                    setNetworkNodeManualPositions((prev) => ({
                        ...prev,
                        [dragging.nodeId]: {
                            x: Number(dragging.baseX || 0) + dx,
                            y: Number(dragging.baseY || 0) + dy
                        }
                    }));
                    return;
                }
                const runtime = networkRuntimeRef.current;
                if (!runtime.panning || runtime.pointerId !== e.pointerId) return;
                const rect = networkCanvasRef.current?.getBoundingClientRect?.();
                if (!rect || rect.width <= 0 || rect.height <= 0) return;
                const ratioX = Number(networkDisplayGraphData.canvasWidth || 1) / rect.width;
                const ratioY = Number(networkDisplayGraphData.canvasHeight || 1) / rect.height;
                const dx = (Number(e.clientX || 0) - runtime.startX) * ratioX;
                const dy = (Number(e.clientY || 0) - runtime.startY) * ratioY;
                if (!runtime.moved && Math.hypot(dx, dy) > 4) {
                    runtime.moved = true;
                    setNetworkPointer((prev) => ({ ...prev, moved: true }));
                }
                setNetworkViewport((prev) => ({
                    ...prev,
                    tx: runtime.startTx + dx,
                    ty: runtime.startTy + dy
                }));
            };
            const finishNetworkV2NodeDrag = (pointerId) => {
                const dragging = networkNodeDraggingRef.current;
                if (!dragging) return;
                if (pointerId !== null && pointerId !== undefined && dragging.pointerId !== pointerId) return;
                const moved = Boolean(dragging.moved);
                networkNodeDraggingRef.current = null;
                setNetworkNodeDragging(null);
                if (dragging.pointerId !== null && dragging.pointerId !== undefined && networkCanvasRef.current?.releasePointerCapture) {
                    try { networkCanvasRef.current.releasePointerCapture(dragging.pointerId); } catch { }
                }
                if (moved) {
                    networkRuntimeRef.current.moved = true;
                    if (networkSuppressClickTimerRef.current) {
                        clearTimeout(networkSuppressClickTimerRef.current);
                        networkSuppressClickTimerRef.current = null;
                    }
                    networkSuppressClickTimerRef.current = setTimeout(() => {
                        networkRuntimeRef.current.moved = false;
                    }, 120);
                }
            };
            const finishNetworkV2Panning = (pointerId) => {
                const runtime = networkRuntimeRef.current;
                if (!runtime.panning) return;
                if (pointerId !== null && pointerId !== undefined && runtime.pointerId !== pointerId) return;
                const moved = Boolean(runtime.moved);
                if (runtime.pointerId !== null && runtime.pointerId !== undefined && networkCanvasRef.current?.releasePointerCapture) {
                    try { networkCanvasRef.current.releasePointerCapture(runtime.pointerId); } catch { }
                }
                runtime.panning = false;
                runtime.pointerId = null;
                runtime.startX = 0;
                runtime.startY = 0;
                runtime.startTx = 0;
                runtime.startTy = 0;
                setNetworkPanning(false);
                setNetworkPointer((prev) => ({ ...prev, pointerId: null, moved }));
                if (networkSuppressClickTimerRef.current) {
                    clearTimeout(networkSuppressClickTimerRef.current);
                    networkSuppressClickTimerRef.current = null;
                }
                if (moved) {
                    networkSuppressClickTimerRef.current = setTimeout(() => {
                        networkRuntimeRef.current.moved = false;
                        setNetworkPointer((prev) => ({ ...prev, moved: false }));
                    }, 120);
                } else {
                    networkRuntimeRef.current.moved = false;
                }
            };
            const handleNetworkV2PointerUp = (e) => {
                finishNetworkV2NodeDrag(e.pointerId);
                finishNetworkV2Panning(e.pointerId);
            };
            const handleNetworkV2PointerCancel = (e) => {
                finishNetworkV2NodeDrag(e.pointerId);
                finishNetworkV2Panning(e.pointerId);
            };
            const handleNetworkV2PointerLeave = () => {
                if (networkNodeDraggingRef.current) {
                    finishNetworkV2NodeDrag(networkNodeDraggingRef.current.pointerId);
                }
                if (!networkRuntimeRef.current.panning) return;
                finishNetworkV2Panning(networkRuntimeRef.current.pointerId);

                : null;

            return (
                <div className="app-shell flex flex-col h-full font-sans text-gray-800 w-full overflow-hidden relative">

                    {showStartPopup && !dirHandle && (

                                <p className="text-sm text-gray-500 mb-6">데이터 안전 보관을 위해<br />로컬 폴더를 연결해주세요.</p>

                                <div className="space-y-2">
                                    {savedHandleName ? (

                            </div>

                                                                handleDeleteBookmark(bookmark.id);

                                                            jumpToEditorPosition(bookmark.blockId, bookmark.top);

                                                        onContextMenu={(e) => {
                                                            e.preventDefault();
                                                            handleDeleteBookmark(bookmark.id);

                                                        className="pointer-events-auto absolute left-0 w-3 h-3 rounded-full bg-rose-500 border border-white shadow hover:bg-rose-600"

                    {/* Window 5: Node */}
                    {
                        isTranslateTab && showNodeWindow && (minWin5 ? (
                            <div className="minimized-strip bg-blue-50" style={{ order: getTranslateLayerOrder("node") }} onMouseDown={() => bringTranslateLayerToFront("node")}>
                                <button onClick={() => setMinWin5(false)} className="text-blue-600 mb-4"><i className="fa-solid fa-plus"></i></button>
                                <span className="vertical-text text-xs text-blue-700">핵심구문</span>
                            </div>
                        ) : (
                            <React.Fragment>
                                <div className="panel-frame panel-node bg-blue-50 border-r border-gray-200 flex flex-col h-full overflow-hidden shrink-0" style={{ width: widths.win5 + 'px', order: getTranslateLayerOrder("node") }}>
                                    <div
                                        onMouseDown={() => bringTranslateLayerToFront("node")}
                                        className={`node-header p-3 text-xs font-bold uppercase flex justify-between items-center transition-colors duration-300 ${selectionMenu ? 'bg-[#BFDBFE] text-blue-900 border-blue-300' : 'bg-blue-100 text-blue-700 border-blue-200'} border-b`}
                                    >
                                        <span><i className="fa-solid fa-code-branch mr-1"></i>핵심구문</span>
                                        <div className="flex gap-1 items-center">
                                            <button onClick={() => toggleAllNodes(false)} className="text-blue-600 hover:bg-blue-200 px-1 rounded"><i className="fa-solid fa-plus"></i></button>
                                            <button onClick={() => toggleAllNodes(true)} className="text-blue-600 hover:bg-blue-200 px-1 rounded"><i className="fa-solid fa-minus"></i></button>
                                            <button onClick={handleDownloadNodes} className="bg-white border border-blue-300 text-blue-600 px-2 py-0.5 rounded hover:bg-blue-50"><i className="fa-solid fa-file-word"></i></button>
                                            <button onClick={() => setMinWin5(true)}><i className="fa-solid fa-minus text-blue-700"></i></button>
                                            <button onClick={() => setShowNodeWindow(false)}><i className="fa-solid fa-times"></i></button>
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto custom-scrollbar p-2">
                                        {groupedCurrentNodes.map((group) => (
                                            <div key={`core-group-${group.key}`} className="mb-2">
                                                <div className="flex items-center justify-between px-2 py-1 rounded border border-blue-200 bg-blue-100/70">
                                                    <div className="flex items-center gap-1 min-w-0">
                                                        <span className="w-3 h-3 rounded-full border border-white shadow-sm shrink-0" style={{ backgroundColor: group.tagColor }}></span>
                                                        <span className="text-[10px] font-bold text-blue-800 truncate">{group.tagLabel}</span>
                                                    </div>
                                                    <span className="text-[10px] text-blue-700 shrink-0">{group.nodes.length}</span>
                                                </div>
                                                <div className="mt-1 space-y-1">
                                                    {group.nodes.map((node) => (
                                                        <div key={node.id} className="node-row cursor-pointer" onClick={() => jumpToEditorPosition(node.blockId)}>
                                                            <div className="flex items-start gap-2">
                                                                <div className="flex gap-1 shrink-0 pt-1">
                                                                    <button onClick={(e) => { e.stopPropagation(); toggleItemMinimize('node', node.id); }} className="text-gray-400 hover:text-blue-500 text-xs"><i className={`fa-solid ${node.isMinimized ? 'fa-plus' : 'fa-minus'}`}></i></button>
                                                                </div>
                                                                <div className="flex-1 min-w-0">
                                                                    <textarea
                                                                        className="node-input node-code"
                                                                        rows={node.isMinimized ? 1 : Math.max(3, (String(node.code || "").split(/\r?\n/).length + 1))}
                                                                        style={{ width: `${Math.max(14, Math.min(64, String(node.code || "").length + 2))}ch`, maxWidth: "100%" }}
                                                                        value={node.code}
                                                                        onClick={(e) => e.stopPropagation()}
                                                                        onChange={(e) => updateNodeText(node.id, 'code', e.target.value)}
                                                                    />
                                                                </div>
                                                            </div>
                                                            {!node.isMinimized && (<>
                                                                <div className="node-orig">"{node.original}"</div>
                                                                <textarea
                                                                    className="node-note-input"
                                                                    placeholder="메모 추가..."
                                                                    rows={1}
                                                                    ref={(el) => autoGrowTextarea(el, 24)}
                                                                    value={node.note || ""}
                                                                    onClick={(e) => e.stopPropagation()}
                                                                    onInput={(e) => autoGrowTextarea(e.currentTarget, 24)}
                                                                    onChange={(e) => updateNodeNote(node.id, e.target.value)}
                                                                />
                                                            </>)}
                                                            {node.isMinimized && <div className="text-xs text-gray-400">...</div>}
                                                            <div className="flex justify-end">
                                                                <button onClick={(e) => { e.stopPropagation(); deleteNode(node.id); }} className="text-gray-400 hover:text-red-500 text-xs"><i className="fa-solid fa-trash-can"></i></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                        {groupedCurrentNodes.length === 0 && (
                                            <div className="text-xs text-blue-700 text-center py-3 border border-blue-200 rounded bg-white">
                                                핵심구문 데이터가 없습니다.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </React.Fragment>
                        ))
                    }

                    {/* Context Menu */}
                    {
                        isTranslateTab && selectionMenu && (
                            <div
                                className="selection-menu fixed z-50 bg-white border border-gray-200 shadow-xl rounded-md flex overflow-visible animate-fade-in-up"
                                style={{ top: selectionMenu.y + 8, left: selectionMenu.x + 5 }}
                            >
                                {/* 개념설명 버튼 (Red Theme) */}
                                <button
                                    onClick={handleExplain}
                                    className="px-2 py-1 text-[11px] font-bold text-red-600 hover:bg-red-50 border-r border-gray-100 flex items-center gap-1 transition-colors"
                                >
                                    <i className="fa-solid fa-highlighter"></i>개념설명
                                </button>
                                <div className="flex items-center gap-1 px-1 py-1 border-r border-gray-100">
                                    <button
                                        onClick={() => handleNode()}
                                        title={`선택 구간 핵심구문 생성 (최근 색상: ${(getCorePhraseTagById(corePhraseLastTagId)?.label || "기본")})`}
                                        className="px-1.5 py-0.5 text-[11px] font-bold text-blue-600 hover:bg-blue-50 rounded flex items-center gap-1 transition-colors"
                                    >
                                        <i className="fa-solid fa-code-branch"></i>핵심구문
                                    </button>
                                    <div className="flex items-center gap-0.5">
                                        {corePhrasePresetColors.map((preset) => {
                                            const matchedTag = corePhraseTags.find((tag) => String(tag?.color || "").toLowerCase() === String(preset.color || "").toLowerCase()) || {
                                                id: `quick-${preset.id}`,
                                                label: preset.label,
                                                color: preset.color
                                            };
                                            const lastTagColor = String(getCorePhraseTagById(corePhraseLastTagId)?.color || "").toLowerCase();
                                            const isSelected = lastTagColor === String(preset.color || "").toLowerCase();
                                            return (
                                                <button
                                                    key={`quick-core-tag-${preset.id}`}
                                                    onClick={() => handleNode(matchedTag)}
                                                    className={`w-4 h-4 rounded-full border shadow-sm ${isSelected ? "border-slate-900" : "border-white"}`}
                                                    style={{ backgroundColor: preset.color }}
                                                    title={`${preset.label} 색상으로 핵심구문`}
                                                ></button>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="relative">
                                    <button
                                        onClick={() => setSelectionMenu((prev) => prev ? { ...prev, analysisOpen: !prev.analysisOpen } : prev)}
                                        className="px-2 py-1 text-[11px] font-bold text-indigo-600 hover:bg-indigo-50 flex items-center gap-1 transition-colors"
                                    >
                                        <i className="fa-solid fa-chart-simple"></i>{"\uBD84\uC11D\u25BC"}
                                    </button>
                                    {selectionMenu.analysisOpen && (
                                        <div className="absolute left-0 top-[30px] z-50 w-[90px] bg-white border border-indigo-200 rounded-md shadow-lg overflow-hidden">
                                            {analysisFields.map((field) => (
                                                <button
                                                    key={`selection-analysis-${field.key}`}
                                                    onClick={() => handleSelectAnalysisField(field.key)}
                                                    className="w-full text-left px-1.5 py-1 text-[10px] leading-tight font-bold text-indigo-700 hover:bg-indigo-50 border-b border-indigo-100 last:border-b-0 break-words"
                                                >
                                                    {field.label}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <button
                                    onClick={handleBookmark}
                                    className="px-2 py-1 text-[11px] font-bold text-rose-600 hover:bg-rose-50 border-l border-gray-100 flex items-center gap-1 transition-colors"
                                    title="선택 문장을 책갈피로 저장"
                                >
                                    <i className="fa-solid fa-bookmark"></i>책갈피
                                </button>
                            </div>
                        )
                    }
                </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
