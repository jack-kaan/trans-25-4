            };

            const normalizeHistoryV2 = (value) => {
                if (!Array.isArray(value)) return [];
                return value.map((item) => {
                    if (!item || typeof item !== "object") return item;
                    if (Object.prototype.hasOwnProperty.call(item, "analysis")) {
                        if (item.analysis === null || (item.analysis && typeof item.analysis === "object")) return item;
                        return { ...item, analysis: null };
                    }
                    return { ...item, analysis: null };
                });
            };

            const normalizeResearchSaveLock = (value) => {
                if (!value || typeof value !== "object") {
                    return { locked: false, lockedAt: null };
                }
                return {
                    locked: !!value.locked,
                    lockedAt: (typeof value.lockedAt === "string" && value.lockedAt.trim()) ? value.lockedAt : null
                };
            };

            const normalizeResearchProfileV2 = (profile) => {
                const base = (profile && typeof profile === "object") ? profile : {};
                return {
                    purpose: typeof base.purpose === "string" ? base.purpose : "",
                    question: typeof base.question === "string" ? base.question : "",
                    keywords: Array.isArray(base.keywords) ? base.keywords : [],
                    ragFiles: Array.isArray(base.ragFiles) ? base.ragFiles : [],
                    saveLock: normalizeResearchSaveLock(base.saveLock)
                };
            };

            const normalizeResearchStoreV2 = (value) => {
                if (!value || typeof value !== "object") return {};
                const next = {};
                Object.entries(value).forEach(([projectId, profile]) => {
                    next[projectId] = normalizeResearchProfileV2(profile);
                });
                return next;
            };

            const normalizeReferencePeekPanelsStore = (value) => {
                if (!value || typeof value !== "object") return {};
                const normalize = (text = "") => String(text || "").replace(/\s+/g, " ").trim();
                const escapeForHtml = (text = "") => String(text || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
                const plainToHtmlLocal = (text = "") => escapeForHtml(text).replace(/\r?\n/g, "<br>");
                const next = {};
                Object.entries(value).forEach(([docId, panels]) => {
                    if (!Array.isArray(panels)) return;
                    const normalizedPanels = panels.map((panel, idx) => {
                        if (!panel || typeof panel !== "object") return null;
                        const cacheKey = String(panel.cacheKey || "").trim();
                        const panelId = String(panel.id || `peek-restored-${docId}-${idx + 1}`);
                        if (!panelId) return null;
                        const normalizedAbstractText = normalize(panel.abstractText || "");
                        const normalizedAbstractHtml = String(panel.abstractHtml || "").trim() || (normalizedAbstractText ? plainToHtmlLocal(normalizedAbstractText) : "");

                            id: panelId,
                            cacheKey,
                            citeNo: normalize(panel.citeNo || ""),
                            referenceLine: normalize(panel.referenceLine || ""),
                            loading: false,
                            abstractText: normalizedAbstractText,
                            abstractHtml: normalizedAbstractHtml,

                            openAlexUrl: String(panel.openAlexUrl || "").trim(),
                            arxivUrl: String(panel.arxivUrl || "").trim(),
                            scholarUrl: String(panel.scholarUrl || "").trim(),
                            source: normalize(panel.source || ""),
                            savedAt: String(panel.savedAt || "").trim(),
                            updatedAt: String(panel.updatedAt || "").trim() || new Date().toISOString()
                        };
                    }).filter(Boolean);
                    if (normalizedPanels.length > 0) {
                        next[String(docId)] = normalizedPanels;
                    }
                });
                return next;
            };

                const raw = String(color || "").trim();
                if (!raw) return null;
                const hex = raw.match(/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i);
                if (hex) {
                    const h = hex[1];
                    if (h.length === 3) {
                        return [
                            parseInt(h[0] + h[0], 16),
                            parseInt(h[1] + h[1], 16),
                            parseInt(h[2] + h[2], 16)
                        ];
                    }
                    return [
                        parseInt(h.slice(0, 2), 16),
                        parseInt(h.slice(2, 4), 16),
                        parseInt(h.slice(4, 6), 16)
                    ];
                }
                const rgb = raw.match(/^rgba?\(([^)]+)\)$/i);
                if (rgb) {
                    const parts = rgb[1].split(",").map((item) => Number(item.trim()));
                    if (parts.length >= 3 && parts.slice(0, 3).every((value) => Number.isFinite(value))) {

                    if (!res.ok) throw new Error(`models.list failed (${res.status})`);
                    const payload = await res.json();
                    const models = Array.isArray(payload?.models) ? payload.models : [];
                    const getModelRank = (id = "") => {
                        const key = String(id || "").toLowerCase();
                        if (key.includes("gemini-3.0-pro")) return 0;
                        if (key.includes("gemini-3.0-flash")) return 1;
                        if (key.includes("gemini-2.5")) return 2;
                        return 3;
                    };
                    const filtered = models
                        .filter((item) => {
                            const methods = Array.isArray(item?.supportedGenerationMethods) ? item.supportedGenerationMethods : [];
                            const modelName = String(item?.name || "");
                            if (!methods.includes("generateContent")) return false;
                            if (shouldExcludeModel(modelName)) return false;
                            return true;
                        })
                        .map((item) => {
                            const id = String(item.name || "").replace(/^models\//, "");
                            const inputTokenLimit = Number(item?.inputTokenLimit || 0);
                            return {
                                id,
                                label: item.displayName || id,
                                inputTokenLimit
                            };
                        })
                        .filter((item) => Boolean(item.id))
                        .sort((a, b) => {
                            const rankDiff = getModelRank(a.id) - getModelRank(b.id);
                            if (rankDiff !== 0) return rankDiff;
                            const tokenDiff = Number(b.inputTokenLimit || 0) - Number(a.inputTokenLimit || 0);
                            if (tokenDiff !== 0) return tokenDiff;
                            return String(a.id).localeCompare(String(b.id));
                        });

                        fetchedAt: Date.now()

                    delete timers[key];

                });
            }, [safeLocalStorageSetItem]);

            const scheduleLocalStorageWrite = React.useCallback((key, value, delayMs = 180) => {

                if (!finalKey) return;
                const pending = localStoragePendingWritesRef.current || {};
                const timers = localStorageWriteTimersRef.current || {};
                pending[finalKey] = String(value ?? "");

                const prevTimer = timers[finalKey];
                if (prevTimer) clearTimeout(prevTimer);

                timers[finalKey] = setTimeout(() => {

                    const nextValue = pending[finalKey];
                    if (nextValue === undefined) return;

                    delete pending[finalKey];

                ];

            const normalizeLatexArtifacts = (text = "") => {
                const greekMap = {

                    pi: "π", phi: "φ"
                };

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`;
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: finalPrompt }] }] })
                });
                if (!res.ok) throw new Error(`analysis API 실패 (${res.status})`);
                const payload = await res.json();
                const modelText = payload?.candidates?.[0]?.content?.parts?.[0]?.text || "";
                const parsed = parseModelJsonObject(modelText);
                if (!parsed) throw new Error("analysis JSON 파싱 실패");
                return normalizeAnalysisObject(parsed);
            };

            const setDocumentAnalysisField = (docId, field, value) => {
                setHistory((prev) => prev.map((item) => {
                    if (item.id !== docId) return item;
                    const current = normalizeAnalysisObject(item.analysis);
                    const nextValue = field === "bibliograph"
                        ? String(value || "").trim()
                        : normalizeBulletText(value || "");
                    return {
                        ...item,
                        analysis: { ...current, [field]: nextValue }
                    };
                }));
            };

            const setDocumentAnalysis = (docId, nextAnalysis) => {
                const normalized = normalizeAnalysisObject(nextAnalysis);
                setHistory((prev) => prev.map((item) => {
                    if (item.id !== docId) return item;
                    const current = normalizeAnalysisObject(item.analysis);
                    return {
                        ...item,
                        analysis: {
                            ...normalized,
                            bibliograph: normalized.bibliograph || current.bibliograph || ""
                        }
                    };
                }));
            };

            const runDocumentAnalysis = async (docInput, fieldKey = null) => {
                const doc = typeof docInput === "object" ? docInput : history.find((item) => item.id === docInput);
                if (!doc) return;
                const docId = doc.id;
                if (fieldKey) {
                    setAnalysisFieldLoadingMap((prev) => ({ ...prev, [`${docId}:${fieldKey}`]: true }));
                } else {
                    setAnalysisLoadingMap((prev) => ({ ...prev, [docId]: true }));
                }
                setAnalysisErrorMap((prev) => ({ ...prev, [docId]: "" }));

                try {
                    const result = await requestDocumentAnalysis(doc, fieldKey);
                    if (fieldKey) {
                        setDocumentAnalysisField(docId, fieldKey, result[fieldKey]);
                    } else {
                        setDocumentAnalysis(docId, result);
                    }
                } catch (err) {
                    console.error(err);
                    setAnalysisErrorMap((prev) => ({ ...prev, [docId]: err.message || "분석 실패" }));
                } finally {
                    if (fieldKey) {
                        setAnalysisFieldLoadingMap((prev) => {
                            const next = { ...prev };
                            delete next[`${docId}:${fieldKey}`];
                            return next;
                        });
                    } else {
                        setAnalysisLoadingMap((prev) => {
                            const next = { ...prev };
                            delete next[docId];
                            return next;
                        });
                    }
                }
            };

            const normalizeKeywords = (values) => {
                const unique = new Set();
                (values || []).forEach((item) => {
                    const keyword = compactText(item).toLowerCase();
                    if (!keyword) return;
                    if (keyword.length < 2) return;
                    unique.add(keyword);
                });
                return Array.from(unique).slice(0, 30);
            };

            const extractKeywordsFromText = (text = "", limit = 8) => {
                const stopWords = new Set([
                    "the", "and", "for", "that", "with", "this", "from", "have", "were", "which",
                    "\uC5F0\uAD6C", "\uACB0\uACFC", "\uBD84\uC11D", "\uBC29\uBC95", "\uC774\uB860", "\uB300\uC0C1", "\uC5D0\uC11C", "\uC73C\uB85C", "\uD558\uB294", "\uD588\uB2E4"
                ]);
                const words = String(text || "")
                    .toLowerCase()
                    .match(/[a-zA-Z\uac00-\ud7a3]{2,}/g) || [];
                const counts = new Map();
                words.forEach((word) => {
                    if (stopWords.has(word)) return;
                    counts.set(word, (counts.get(word) || 0) + 1);
                });
                return Array.from(counts.entries())
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, limit)
                    .map(([word]) => word);
            };

            const splitTextByTokenBudget = (text = "", maxChars = 2000) => {
                const lines = String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
                const chunks = [];
                let current = "";
                lines.forEach((line) => {
                    const next = current ? `${current}\n${line}` : line;
                    if (next.length <= maxChars) {
                        current = next;
                    } else {
                        if (current) chunks.push(current);
                        if (line.length > maxChars) {
                            for (let i = 0; i < line.length; i += maxChars) {
                                chunks.push(line.slice(i, i + maxChars));
                            }
                            current = "";
                        } else {
                            current = line;
                        }
                    }
                });
                if (current) chunks.push(current);
                return chunks;
            };

            const escapeWordHtml = (value = "") => String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");

            const createWordBlob = (bodyHtml, forceLegacyDoc = false) => {
                const html = `
<!doctype html>
<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'>
<head><meta charset="utf-8"></head>
<body>${bodyHtml}</body>
</html>
                `.trim();
                if (!forceLegacyDoc && typeof htmlDocx !== "undefined" && htmlDocx && typeof htmlDocx.asBlob === "function") {
                    return htmlDocx.asBlob(html);
                }
                const payload = `\ufeff${html}`;
                return new Blob([payload], { type: "application/msword;charset=utf-8" });
            };

            const triggerWordDownload = (blob, filename) => {
                if (typeof saveAs !== "undefined" && typeof saveAs === "function") {

                const url = URL.createObjectURL(blob);
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const toAPAFileName = (metadata = {}, fallbackTitle = "Untitled") => {

                const authorRaw = String(metadata.author || "Unknown").replace(/[\\/:*?"<>|]/g, "").trim() || "Unknown";
                const yearRaw = String(metadata.year || "n.d.").match(/\d{4}/)?.[0] || "n.d.";
                const authorLast = authorRaw.includes(",")
                    ? authorRaw.split(",")[0].trim()
                    : (authorRaw.split(/\s+/).filter(Boolean).slice(-1)[0] || "Unknown");
                const shortTitle = safeTitle.split(/\s+/).slice(0, 8).join(" ");

                    const part = (p || "").trim();
                    if (!part) return;
                    const candidate = current ? `${current}\n\n${part}` : part;
                    if (candidate.length <= maxLen) {
                        current = candidate;
                    } else {
                        if (current) chunks.push(current);
                        if (part.length <= maxLen) {
                            current = part;
                        } else {
                            for (let i = 0; i < part.length; i += maxLen) {
                                chunks.push(part.slice(i, i + maxLen));
                            }
                            current = "";
                        }
                    }
                });
                if (current) chunks.push(current);
                return chunks;
            };

            const extractReadableFromHtml = (htmlText, rawUrl) => {
                const looksHtml = /<\s*html|<\s*body|<\s*p[\s>]/i.test(htmlText || "");
                if (!looksHtml) {
                    const lines = String(htmlText || "")
                        .split(/\r?\n/)
                        .map(s => s.trim())
                        .filter(Boolean);
                    const fallbackTitle = lines[0] || new URL(rawUrl).hostname;
                    const chunks = splitTextChunks(lines, 1800);
                    return {
                        title: fallbackTitle,
                        author: "Unknown",
                        year: "n.d.",
                        chunks: chunks.length ? chunks : [String(htmlText || "").slice(0, 1800)]
                    };
                }

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");
                doc.querySelectorAll("script,style,noscript,iframe,svg,canvas,video,audio,picture,img,figure,source").forEach(el => el.remove());

                const title =
                    doc.querySelector("meta[property='og:title']")?.getAttribute("content") ||
                    doc.querySelector("meta[name='twitter:title']")?.getAttribute("content") ||
                    doc.querySelector("title")?.textContent ||
                    new URL(rawUrl).hostname;
                const author =
                    doc.querySelector("meta[name='author']")?.getAttribute("content") ||
                    doc.querySelector("meta[property='article:author']")?.getAttribute("content") ||
                    "Unknown";
                const dateStr =
                    doc.querySelector("meta[property='article:published_time']")?.getAttribute("content") ||
                    doc.querySelector("meta[name='date']")?.getAttribute("content") ||
                    doc.querySelector("time")?.getAttribute("datetime") ||
                    "";
                const year = dateStr.match(/\d{4}/)?.[0] || "n.d.";

                const blockCandidates = Array.from(doc.querySelectorAll("h1,h2,h3,p,li,blockquote"))
                    .map(el => el.textContent.trim())
                    .filter(Boolean)
                    .filter(t => t.length > 20);

                const paragraphs = blockCandidates.length
                    ? blockCandidates
                    : (doc.body?.innerText || "")
                        .split(/\n+/)
                        .map(s => s.trim())
                        .filter(Boolean)
                        .filter(t => t.length > 20);

                const chunks = splitTextChunks(paragraphs, 1800);
                return {
                    title: title.trim(),
                    author: author.trim(),
                    year,
                    chunks: chunks.length ? chunks : [paragraphs.join("\n").slice(0, 1800)]
                };
            };

            const requestExternalProxyConsent = (() => {
                let cachedConsent = null;
                return (contextLabel = "요청한 URL") => {
                    if (cachedConsent !== null) return cachedConsent;
                    if (typeof window !== "undefined" && typeof window.confirm === "function") {
                        cachedConsent = window.confirm(
                            `${contextLabel} 직접 요청이 실패했습니다.\n외부 프록시(r.jina.ai/allorigins)를 사용하면 URL/본문 데이터가 제3자 서비스로 전송될 수 있습니다.\n프록시 폴백을 진행하시겠습니까?`
                        );
                        return cachedConsent;
                    }
                    cachedConsent = false;
                    return cachedConsent;
                };
            })();

            const buildExternalProxyCandidates = (normalizedUrl, includeAllOrigins = true) => {
                const baseNoScheme = normalizedUrl.replace(/^https?:\/\//i, "");
                const candidates = [
                    `https://r.jina.ai/${normalizedUrl}`,
                    `https://r.jina.ai/http://${baseNoScheme}`
                ];
                if (includeAllOrigins) {
                    candidates.push(`https://api.allorigins.win/raw?url=${encodeURIComponent(normalizedUrl)}`);
                }
                return candidates;
            };

            const fetchUrlPageText = async (rawUrl) => {
                const raw = String(rawUrl || "").trim();
                let normalized = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
                try {
                    normalized = new URL(normalized).toString();
                } catch (e) {
                    throw new Error("유효한 URL 형식이 아닙니다.");
                }
                const statusErrors = [];

                try {
                    const direct = await fetch(normalized, { method: "GET" });
                    if (direct.ok) {
                        const text = await direct.text();
                        if (text && text.trim()) return { url: normalized, text };
                        statusErrors.push(`direct -> empty`);
                    } else {
                        statusErrors.push(`direct -> ${direct.status}`);
                    }
                } catch (e) {
                    statusErrors.push("direct -> network error");
                    console.warn("Direct fetch failed:", e);
                }

                const allowProxyFallback = requestExternalProxyConsent("입력한 웹 페이지");
                if (!allowProxyFallback) {
                    throw new Error(`URL fetch 실패 (${statusErrors.join(" | ")}). 외부 프록시 폴백이 취소되었습니다.`);
                }

                const proxyCandidates = buildExternalProxyCandidates(normalized, true);
                for (const proxyUrl of proxyCandidates) {
                    try {
                        const proxied = await fetch(proxyUrl, { method: "GET" });
                        if (!proxied.ok) {
                            statusErrors.push(`${proxyUrl} -> ${proxied.status}`);
                            continue;
                        }
                        const text = await proxied.text();
                        if (text && text.trim()) return { url: normalized, text };
                        statusErrors.push(`${proxyUrl} -> empty`);
                    } catch (e) {
                        statusErrors.push(`${proxyUrl} -> network error`);
                    }
                }

                throw new Error(`URL fetch 실패 (${statusErrors.join(" | ")})`);
            };

            const fetchUrlPageTextViaGemini = async (rawUrl, key, model) => {
                const raw = String(rawUrl || "").trim();
                let normalized = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
                try {
                    normalized = new URL(normalized).toString();
                } catch (e) {
                    throw new Error("유효한 URL 형식이 아닙니다.");
                }

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
                const prompt = [
                    "아래 URL의 본문 텍스트를 가능한 한 원문 그대로 추출하세요.",
                    "요약/해설/의견/마크다운 없이 본문 텍스트만 출력하세요.",
                    "접근이 불가능하면 정확히 URL_CONTEXT_UNAVAILABLE 만 출력하세요.",
                    `URL: ${normalized}`
                ].join("\n");

                const bodyCandidates = [
                    { contents: [{ parts: [{ text: prompt }] }], tools: [{ urlContext: {} }] },
                    { contents: [{ parts: [{ text: prompt }] }], tools: [{ googleSearch: {} }] }
                ];

                const errors = [];
                for (const body of bodyCandidates) {
                    try {
                        const res = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(body)
                        });
                        const data = await res.json().catch(() => ({}));
                        if (!res.ok) {
                            errors.push(data?.error?.message || `HTTP ${res.status}`);
                            continue;
                        }
                        const text = (data?.candidates?.[0]?.content?.parts || [])
                            .map(p => p?.text || "")
                            .join("\n")
                            .trim();
                        if (!text) {
                            errors.push("empty response");
                            continue;
                        }
                        if (text === "URL_CONTEXT_UNAVAILABLE" || /URL_CONTEXT_UNAVAILABLE/i.test(text)) {
                            errors.push("url context unavailable");
                            continue;
                        }
                        if (text.length < 200) {
                            errors.push("response too short");
                            continue;
                        }
                        return { url: normalized, text };
                    } catch (e) {
                        errors.push("network error");
                    }
                }
                throw new Error(`URL fetch 실패 (프록시/URL-Context 모두 실패: ${errors.join(" | ")})`);
            };

            const handleUrlTranslate = async () => {
                if (!apiKey) return alert("API Key가 필요합니다.");
                if (urlLoading) return;
                if (!urlInput.trim()) return alert("URL을 입력하세요.");

                const tempId = Math.random().toString(36).substr(2, 9);
                setUrlLoading(true);
                setQueue(prev => [...prev, { tempId, file: null, filename: urlInput.trim(), percent: 0 }]);
                setActiveId(tempId);
                setLiveStreams(prev => ({ ...prev, [tempId]: [] }));

                try {
                    let fetched;
                    if (urlManualText.trim()) {
                        const raw = String(urlInput || "").trim();
                        let normalized = /^https?:\/\//i.test(raw) ? raw : `https://${raw}`;
                        try { normalized = new URL(normalized).toString(); } catch (e) { /* keep raw */ }
                        fetched = { url: normalized, text: urlManualText.trim() };
                    } else {
                        try {
                            fetched = await fetchUrlPageText(urlInput.trim());
                        } catch (fetchErr) {
                            console.warn("URL direct/proxy fetch failed. Trying Gemini URL tools.", fetchErr);
                            try {
                                fetched = await fetchUrlPageTextViaGemini(urlInput.trim(), apiKey, modelId);
                            } catch (toolErr) {
                                throw new Error(
                                    `${toolErr.message}\n자동 수집이 차단된 사이트입니다. URL 패널의 '수동 본문 붙여넣기'에 원문을 넣고 다시 실행하세요.`
                                );
                            }
                        }
                    }
                    const { url, text } = fetched;
                    const extracted = extractReadableFromHtml(text, url);
                    const previewText = (extracted.chunks || []).slice(0, 2).join(" ").slice(0, 1800);
                    const apaTitle = await generateAPATitleAPI(previewText, apiKey, modelId);
                    const filename = apaTitle || toAPAFileName(extracted, extracted.title);

                    const blocks = [];
                    const chunks = (extracted.chunks || []).filter(Boolean);
                    let inReferencesMode = false;
                    for (let i = 0; i < chunks.length; i++) {
                        if (cancelledRef.current.has(tempId)) {
                            setQueue(prev => prev.filter(q => q.tempId !== tempId));
                            setLiveStreams(prev => { const next = { ...prev }; delete next[tempId]; return next; });
                            return;
                        }
                        const sourceText = chunks[i];
                        let translated;
                        if (inReferencesMode) {
                            translated = { html: translateReferencesOnlyChunkHtml(sourceText), enteredReferences: true };
                        } else {
                            translated = await translateChunkPreservingReferences(sourceText, apiKey, sourceLang, modelId);
                            if (translated.enteredReferences) inReferencesMode = true;
                        }
                        const blockId = Date.now() + Math.random();
                        const decoratedHtml = decorateCitationNumbers(translated.html, tempId, blockId);
                        blocks.push({ id: blockId, source: sourceText, data: decoratedHtml });
                        setLiveStreams(prev => ({ ...prev, [tempId]: [...blocks] }));
                        setQueue(prev => prev.map(q => q.tempId === tempId ? { ...q, percent: Math.floor(((i + 1) / chunks.length) * 100) } : q));
                    }

                    const finalItem = {
                        id: Date.now(),
                        filename,
                        date: new Date().toLocaleTimeString(),
                        content: blocks,
                        metadata: { title: extracted.title, author: extracted.author, year: extracted.year, url },
                        projectId: null,
                        analysis: createEmptyAnalysis()
                    };
                    setHistory(prev => [finalItem, ...prev]);
                    setQueue(prev => prev.filter(q => q.tempId !== tempId));
                    if (activeId === tempId) setActiveId(finalItem.id);
                    if (dirHandle) saveToDisk();
                    runDocumentAnalysis(finalItem);
                    setUrlInput("");
                    setUrlManualText("");
                    setShowUrlInput(false);
                } catch (error) {
                    console.error(error);
                    alert("URL 번역 중 오류: " + error.message);
                    setQueue(prev => prev.filter(q => q.tempId !== tempId));
                } finally {
                    setUrlLoading(false);
                }
            };

            const handleFileUpload = async (e) => {
                if (!apiKey) return alert("API Key ?꾩슂");
                const files = Array.from(e.target.files);
                if (!files.length) return;
                const newItems = files.map(f => ({ tempId: Math.random().toString(36).substr(2, 9), file: f, filename: f.name, percent: 0 }));
                setQueue(p => [...p, ...newItems]);
                if (newItems.length) setActiveId(newItems[0].tempId);

                for (const item of newItems) {
                    setLiveStreams(p => ({ ...p, [item.tempId]: [] }));
                    try {
                        const buffer = await item.file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument(buffer).promise;

                        // [Step 1] Analyze First Page for APA Title
                        let finalFilename = item.filename;
                        try {
                            const firstPage = await pdf.getPage(1);
                            const firstContent = await firstPage.getTextContent();
                            const firstText = firstContent.items.map(s => s.str).join(' ');
                            const apaTitle = await generateAPATitleAPI(firstText, apiKey, modelId);
                            if (apaTitle) {
                                finalFilename = apaTitle; // Use APA title if successful
                            }
                        } catch (err) { console.warn("APA Title generation failed", err); }

                        const meta = await pdf.getMetadata();
                        const extractedMeta = { title: meta.info?.Title || finalFilename, author: meta.info?.Author || "Unknown", year: meta.info?.CreationDate ? new Date(meta.info.CreationDate).getFullYear() : "n.d." };

                        let blocks = [];
                        let inReferencesMode = false;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            // Check cancellation
                            if (cancelledRef.current.has(item.tempId)) {
                                console.log(`Translation cancelled for ${item.tempId}`);
                                setLiveStreams(p => { const next = { ...p }; delete next[item.tempId]; return next; });
                                setQueue(p => p.filter(q => q.tempId !== item.tempId));
                                return;
                            }

                            const page = await pdf.getPage(i);
                            const content = await page.getTextContent();
                            const text = content.items.map(s => s.str).join(' ');
                            if (text.trim()) {
                                let translated;
                                if (inReferencesMode) {
                                    translated = { html: translateReferencesOnlyChunkHtml(text), enteredReferences: true };
                                } else {
                                    translated = await translateChunkPreservingReferences(text, apiKey, sourceLang, modelId);
                                    if (translated.enteredReferences) inReferencesMode = true;
                                }
                                const blockId = Date.now() + Math.random();
                                const decoratedHtml = decorateCitationNumbers(translated.html, item.tempId, blockId);
                                blocks.push({ id: blockId, source: text, data: decoratedHtml });
                                setLiveStreams(p => ({ ...p, [item.tempId]: [...blocks] }));
                            }
                            setQueue(p => p.map(q => q.tempId === item.tempId ? { ...q, percent: Math.floor((i / pdf.numPages) * 100) } : q));
                        }
                        const apaFinalName = toAPAFileName(extractedMeta, finalFilename);
                        const finalItem = {
                            id: Date.now(),
                            filename: apaFinalName || finalFilename,
                            date: new Date().toLocaleTimeString(),
                            content: blocks,
                            metadata: extractedMeta,
                            projectId: null,
                            analysis: createEmptyAnalysis()
                        };
                        setHistory(p => [finalItem, ...p]);
                        setQueue(p => p.filter(q => q.tempId !== item.tempId));
                        if (activeId === item.tempId) setActiveId(finalItem.id);
                        runDocumentAnalysis(finalItem);

                        // Auto-Save after upload completion!
                        if (dirHandle) saveToDisk();

                    } catch (err) { console.error(err); setQueue(p => p.filter(q => q.tempId !== item.tempId)); }
                }
            };

            const addCorePhraseTag = () => {
                const label = compactText(corePhraseTagInput || "");
                if (!label) return;
                const nextTag = {
                    id: `core-tag-${Date.now()}`,
                    label,
                    color: corePhraseTagColorInput || "#3B82F6"
                };
                setCorePhraseTags((prev) => [...prev, nextTag]);
                setCorePhraseLastTagId(nextTag.id);
                setCorePhraseTagInput("");
                setShowCorePhraseColorPanel(false);
            };
            const getCorePhraseTagById = (tagId) => {
                const found = corePhraseTags.find((tag) => String(tag.id) === String(tagId));
                if (found) return found;
                if (corePhraseTags.length > 0) return corePhraseTags[0];
                return { id: "core-default", label: "기본", color: "#BFDBFE" };
            };
            const buildReferenceCacheKey = (referenceLine = "") => {
                const normalized = compactText(referenceLine).toLowerCase();
                let hash = 0;
                for (let i = 0; i < normalized.length; i += 1) {
                    hash = ((hash << 5) - hash) + normalized.charCodeAt(i);
                    hash |= 0;
                }
                return `ref_${Math.abs(hash)}_${normalized.length}`;
            };
            const decodeHtmlEntities = (value = "") => {
                const textArea = document.createElement("textarea");
                textArea.innerHTML = String(value || "");
                return textArea.value;
            };
            const stripMarkupToPlain = (value = "") => {
                const decoded = decodeHtmlEntities(String(value || ""));
                return compactText(decoded.replace(/<[^>]+>/g, " ").replace(/\s+/g, " "));
            };
            const buildScholarQueryText = (referenceLine = "") => {
                const cleaned = compactText(referenceLine || "")
                    .replace(/^\[\d{1,3}\]\s*/, "")
                    .replace(/\s+/g, " ")
                    .trim();
                return cleaned;
            };
            const extractDoi = (referenceLine = "") => {
                const text = String(referenceLine || "");
                const direct = text.match(/\b10\.\d{4,9}\/[-._;()/:A-Z0-9]+\b/i);
                if (direct) return direct[0].replace(/[)\].,;]+$/, "");
                const prefixed = text.match(/doi\s*:\s*(10\.\d{4,9}\/[-._;()/:A-Z0-9]+)/i);
                if (prefixed) return prefixed[1].replace(/[)\].,;]+$/, "");
                return "";
            };
            const extractArxivId = (referenceLine = "") => {
                const text = String(referenceLine || "");
                const prefixed = text.match(/arxiv\s*:\s*([a-z\-\.]*\d{4}\.\d{4,5}(?:v\d+)?|[a-z\-]+\/\d{7}(?:v\d+)?)/i);
                if (prefixed) return prefixed[1];
                const urlMatch = text.match(/arxiv\.org\/abs\/([a-z\-\.]*\d{4}\.\d{4,5}(?:v\d+)?|[a-z\-]+\/\d{7}(?:v\d+)?)/i);
                if (urlMatch) return urlMatch[1];
                return "";
            };
            const buildReferenceQueryText = (referenceLine = "") => {
                const cleaned = compactText(referenceLine || "")
                    .replace(/^\[\d{1,3}\]\s*/, "")
                    .replace(/\barxiv\s*:\s*[^\s,;]+/ig, " ")
                    .replace(/\bdoi\s*:\s*10\.\d{4,9}\/[-._;()/:A-Z0-9]+\b/ig, " ")
                    .replace(/\b10\.\d{4,9}\/[-._;()/:A-Z0-9]+\b/ig, " ")
                    .replace(/\s+/g, " ")
                    .trim();
                return cleaned;
            };
            const restoreOpenAlexAbstract = (invertedIndex) => {
                if (!invertedIndex || typeof invertedIndex !== "object") return "";
                const entries = [];
                Object.entries(invertedIndex).forEach(([word, positions]) => {
                    if (!Array.isArray(positions)) return;
                    positions.forEach((pos) => {
                        if (!Number.isInteger(pos)) return;
                        entries.push([pos, word]);
                    });
                });
                if (entries.length === 0) return "";
                entries.sort((a, b) => a[0] - b[0]);
                return compactText(entries.map((entry) => entry[1]).join(" "));
            };
            const parseArxivAtomXml = (xmlText = "") => {
                const value = String(xmlText || "").trim();
                if (!value) return [];
                try {
                    const xmlDoc = new DOMParser().parseFromString(value, "text/xml");
                    const entries = Array.from(xmlDoc.getElementsByTagName("entry"));
                    return entries.map((entry) => {
                        const getText = (tag) => {
                            const el = entry.getElementsByTagName(tag)[0];
                            return compactText(el?.textContent || "");
                        };
                        const idUrl = getText("id");
                        const title = getText("title");
                        const summary = compactText(getText("summary").replace(/\s+/g, " "));
                        const published = getText("published");
                        const year = published.match(/\d{4}/)?.[0] || "";
                        const idMatch = idUrl.match(/arxiv\.org\/abs\/([^/?#]+)/i);
                        const arxivId = idMatch ? idMatch[1] : "";
                        return {
                            title,
                            summary,
                            year,
                            arxivId,
                            arxivUrl: arxivId ? `https://arxiv.org/abs/${arxivId}` : (idUrl || "")
                        };
                    }).filter((item) => item.summary || item.title);
                } catch {
                    return [];
                }
            };
            const fetchWithTimeout = async (url, options = {}, timeoutMs = 12000) => {
                const controller = (typeof AbortController === "function") ? new AbortController() : null;
                let timeoutId = null;
                try {
                    if (controller) {
                        timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                    }
                    const response = await fetch(url, { ...(options || {}), signal: controller ? controller.signal : undefined });
                    return response;
                } finally {
                    if (timeoutId !== null) clearTimeout(timeoutId);
                }
            };
            const fetchArxivByIdOrQuery = async ({ arxivId = "", queryText = "" } = {}) => {
                const fetchArxivFeed = async (url) => {
                    let lastError = null;

                    try {
                        const directRes = await fetchWithTimeout(url, { method: "GET" }, 7000);
                        if (directRes.ok) {
                            const directText = await directRes.text();
                            if (compactText(directText)) return directText;
                            lastError = new Error("direct empty");
                        } else {
                            lastError = new Error(`direct status ${directRes.status}`);
                        }
                    } catch (err) {
                        lastError = err;
                    }

                    const allowProxyFallback = requestExternalProxyConsent("arXiv 메타데이터");
                    if (!allowProxyFallback) {
                        if (lastError) throw new Error(`arXiv 직접 요청 실패 (${String(lastError.message || lastError)}). 외부 프록시 폴백이 취소되었습니다.`);
                        throw new Error("arXiv 직접 요청 실패 및 외부 프록시 폴백이 취소되었습니다.");
                    }

                    const proxyCandidates = buildExternalProxyCandidates(url, false);
                    for (const proxyUrl of proxyCandidates) {
                        try {
                            const proxied = await fetchWithTimeout(proxyUrl, { method: "GET" }, 7000);
                            if (!proxied.ok) {
                                lastError = new Error(`${proxyUrl} status ${proxied.status}`);
                                continue;
                            }
                            const text = await proxied.text();
                            if (compactText(text)) return text;
                            lastError = new Error(`${proxyUrl} empty`);
                        } catch (err) {
                            lastError = err;
                        }
                    }
                    if (lastError) throw lastError;
                    throw new Error("arXiv 응답을 받지 못했습니다.");
                };

                const candidateUrls = [];
                if (compactText(arxivId)) {
                    candidateUrls.push(`https://export.arxiv.org/api/query?id_list=${encodeURIComponent(arxivId)}&max_results=1`);
                    if (compactText(queryText)) {
                        candidateUrls.push(`https://export.arxiv.org/api/query?search_query=all:${encodeURIComponent(queryText)}&start=0&max_results=3`);
                    }
                }
                for (const url of candidateUrls) {
                    try {
                        const xml = await fetchArxivFeed(url);
                        const entries = parseArxivAtomXml(xml);
                        if (entries.length > 0) return entries[0];
                    } catch (err) {
                        console.warn("arXiv fetch failed:", err);
                    }
                }
                return null;
            };
            const fetchOpenAlexByQuery = async ({ doi = "", queryText = "" } = {}) => {
                const candidates = [];
                if (compactText(doi)) {
                    candidates.push(`https://api.openalex.org/works?filter=doi:${encodeURIComponent(doi)}`);
                }
                if (compactText(queryText)) {
                    candidates.push(`https://api.openalex.org/works?search=${encodeURIComponent(queryText)}&per-page=5`);
                }
                for (const url of candidates) {
                    try {
                        const res = await fetchWithTimeout(url, { method: "GET" }, 9000);
                        if (!res.ok) continue;
                        const json = await res.json();
                        const work = Array.isArray(json?.results) ? json.results[0] : null;

            const expandAllCategory = () => {
                if (!classifyProjId) return;
                const categories = (classifyData[classifyProjId] || []).filter((p) => !p.isSource).map((p) => p.id);
                setCollapsedPillars((prev) => {

                    categories.forEach((id) => next.delete(id));

                });

            const toggleQualitativePillars = () => {

                const sourcePillars = pillars.filter((p) => p.isSource);
                const categoryPillars = pillars.filter((p) => !p.isSource);

                    classifyCategoryBackupRef.current[classifyProjId] = JSON.parse(JSON.stringify(categoryPillars));

                    setClassifyData((prev) => ({
                        ...prev,
                        [classifyProjId]: sourcePillars
                    }));
                    setCollapsedPillars((prev) => {
                        const next = new Set(prev);
                        categoryIds.forEach((id) => next.delete(id));
                        return next;
                    });
                    return;

                const backup = classifyCategoryBackupRef.current[classifyProjId];
                const restored = Array.isArray(backup) && backup.length > 0
                    ? JSON.parse(JSON.stringify(backup))
                    : [{ id: Date.now(), title: "새 분류", nodes: [] }];
                setClassifyData((prev) => ({
                    ...prev,
                    [classifyProjId]: [...sourcePillars, ...restored]
                }));

            // Pillar Reordering
            const handlePillarDragStart = (e, pid) => { setDraggedPillarId(pid); e.dataTransfer.effectAllowed = "move"; };
            const handlePillarDrop = (e, targetPid) => {
                e.preventDefault();
                if (!draggedPillarId || draggedPillarId === targetPid) return;
                const pList = [...(classifyData[classifyProjId] || [])];
                const fromIdx = pList.findIndex(p => p.id === draggedPillarId);
                const toIdx = pList.findIndex(p => p.id === targetPid);
                const [moved] = pList.splice(fromIdx, 1);
                pList.splice(toIdx, 0, moved);
                setClassifyData(prev => ({ ...prev, [classifyProjId]: pList }));
                setDraggedPillarId(null);
            };

            const handleClassifyDragStart = (e, node, pid) => { setDraggedClassifyNode({ node, sourcePillarId: pid }); e.dataTransfer.effectAllowed = "move"; e.stopPropagation(); };
            const handleClassifyDrop = (e, targetPid) => {
                e.preventDefault();
                if (!draggedClassifyNode) return;
                const { node, sourcePillarId } = draggedClassifyNode;
                if (sourcePillarId === targetPid) return;

                const pList = [...(classifyData[classifyProjId] || [])];
                const sourcePillar = pList.find(p => p.id === sourcePillarId);
                const targetPillar = pList.find(p => p.id === targetPid);

                if (!targetPillar) return;

                // [LOGIC] Moving from Source -> Always Copy (Source keeps audit trail)
                // [LOGIC] Moving Category -> Category -> Actual Move
                if (sourcePillar && !sourcePillar.isSource) {
                    sourcePillar.nodes = sourcePillar.nodes.filter(n => n.id !== node.id);
                }

                // Avoid duplicates in target
                if (!targetPillar.nodes.find(n => n.id === node.id)) {
                    targetPillar.nodes = [...targetPillar.nodes, node];
                }

                setClassifyData(prev => ({ ...prev, [classifyProjId]: pList }));
                setDraggedClassifyNode(null);
            };
            const handleClassifyDownload = () => {
                const proj = projects.find(p => p.id === classifyProjId);
                const pillars = classifyData[classifyProjId] || [];
                const filename = `${proj.name}_분류결과.doc`;
                const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'></head><body>";
                let bodyHtml = `<h1>[${proj.name}] 분류 결과</h1>`;
                pillars.forEach(p => {
                    bodyHtml += `<h3>${p.title}</h3><table border='1' width='100%'><tr><th>Code</th><th>Text</th><th>Ref</th></tr>`;
                    p.nodes.forEach(n => bodyHtml += `<tr><td>${n.code}</td><td>${n.text}</td><td>${n.apa}</td></tr>`);
                    bodyHtml += `</table>`;
                });
                const link = document.createElement("a"); link.href = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(header + bodyHtml + "</body></html>");
                link.download = filename; link.click();
            };

            // Project & File Utils
            const updateProjectName = (id, newName) => setProjects(prev => prev.map(p => p.id === id ? { ...p, name: newName } : p));
            const toggleProjectCollapse = (id) => setProjects(prev => prev.map(p => p.id === id ? { ...p, collapsed: !p.collapsed } : p));
            const createProject = (source = "menu") => {
                const newProjectId = Date.now() + Math.floor(Math.random() * 1000);
                const newProjectName = source === "research" ? "새 프로젝트" : "새 프로젝트";
                const newProject = { id: newProjectId, name: newProjectName, collapsed: false };
                setProjects(prev => [...prev, newProject]);
                setActiveProjectId(newProjectId);
                setResearchData((prev) => ({
                    ...prev,
                    [newProjectId]: normalizeResearchProfileV2(prev[newProjectId] || {})
                }));
                setClassifyData((prev) => {
                    if (Object.prototype.hasOwnProperty.call(prev || {}, newProjectId)) return prev;
                    return { ...prev, [newProjectId]: [] };
                });
                if (activeTab === "coding" && classifyProjId) {
                    setClassifyProjId(newProjectId);
                }
            };
            const deleteProject = (e, id) => {
                e.stopPropagation(); // 클릭 이벤트 전파 방지 (열기/폴더 이동 간섭 방지)
                if (confirm("프로젝트를 삭제하시겠습니까?\n(포함된 번역 파일은 삭제되지 않고 Root로 이동합니다.)")) {
                    // 1. 해당 프로젝트에 속한 파일들의 projectId를 null(Root)로 변경
                    setHistory(prev => prev.map(h => h.projectId === id ? { ...h, projectId: null } : h));
                    // 2. 프로젝트 배너(폴더)만 삭제
                    setProjects(prev => {
                        const next = prev.filter(p => p.id !== id);
                        if (String(activeProjectId) === String(id)) {
                            setActiveProjectId(next.length > 0 ? next[0].id : null);
                        }
                        return next;
                    });
                    setResearchData((prev) => {
                        const next = { ...prev };
                        delete next[id];
                        return next;
                    });
                    setClassifyData((prev) => {
                        const next = { ...prev };
                        delete next[id];
                        return next;
                    });
                    // 3. 분류 모드가 켜져 있으면 종료
                    if (classifyProjId === id) closeClassificationMode();
                }
            };
            const updateFileName = (id, newName) => {
                setHistory(prev => prev.map(h => h.id === id
                    ? { ...h, filename: newName, metadata: { ...(h.metadata || {}), title: newName } }
                    : h
                ));
                // Also sync with classification pillars if they exist
                setClassifyData(prev => {
                    const updated = { ...prev };
                    Object.keys(updated).forEach(projId => {
                        updated[projId] = updated[projId].map(p => p.id === id ? { ...p, title: newName } : p);
                    });
                    return updated;
                });
            };
            const addProject = () => createProject("menu");
            const handleDragStart = (e, fid) => { setDraggedFileId(fid); e.dataTransfer.effectAllowed = "move"; e.stopPropagation(); };
            const handleDragOver = (e, tid) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; setDragOverTarget(tid); };
            const handleDrop = (e, pid) => { e.preventDefault(); e.stopPropagation(); if (draggedFileId) { setHistory(prev => prev.map(h => h.id === draggedFileId ? { ...h, projectId: pid } : h)); setDraggedFileId(null); setDragOverTarget(null); } };
            const restoreMemos = () => { if (memos[activeId]) setMemos(prev => ({ ...prev, [activeId]: prev[activeId].map(m => ({ ...m, isHidden: false })) })); };
            const toggleItemMinimize = (type, itemId) => {
                if (type === 'memo') setMemos(prev => ({ ...prev, [activeId]: prev[activeId].map(m => m.id === itemId ? { ...m, isMinimized: !m.isMinimized } : m) }));
                else if (type === 'node') setNodes(prev => ({ ...prev, [activeId]: prev[activeId].map(n => n.id === itemId ? { ...n, isMinimized: !n.isMinimized } : n) }));
            };
            const hideMemo = (itemId) => setMemos(prev => ({ ...prev, [activeId]: prev[activeId].map(m => m.id === itemId ? { ...m, isHidden: true } : m) }));
            const deleteMemo = (itemId) => {
                if (!confirm("모든 해석 팝업을 삭제하시겠습니까?")) return;
                setMemos(prev => ({
                    ...prev,
                    [activeId]: (prev[activeId] || []).filter(m => m.id !== itemId)
                }));
            };
            const updateNodeText = (nid, f, v) => {
                setNodes(prev => ({ ...prev, [activeId]: (prev[activeId] || []).map(n => n.id === nid ? { ...n, [f]: v } : n) }));
                setClassifyData(prev => {
                    let changed = false;
                    const updated = { ...prev };
                    Object.keys(updated).forEach(projId => {
                        updated[projId] = (updated[projId] || []).map(p => {
                            let touched = false;
                            const nextNodes = (p.nodes || []).map(n => {
                                if (n.id !== nid) return n;
                                touched = true;
                                changed = true;
                                return { ...n, [f]: v };
                            });
                            return touched ? { ...p, nodes: nextNodes } : p;
                        });
                    });
                    return changed ? updated : prev;
                });
            };
            const deleteNode = (nid) => {
                if (!confirm("모든 질적코딩 팝업을 삭제하시겠습니까?")) return;
                setNodes(prev => ({ ...prev, [activeId]: (prev[activeId] || []).filter(n => n.id !== nid) }));
                setClassifyData(prev => {
                    let changed = false;
                    const updated = { ...prev };
                    Object.keys(updated).forEach(projId => {
                        updated[projId] = (updated[projId] || []).map(p => {
                            const before = (p.nodes || []).length;
                            const nextNodes = (p.nodes || []).filter(n => n.id !== nid);
                            if (nextNodes.length !== before) {
                                changed = true;
                                return { ...p, nodes: nextNodes };
                            }
                            return p;
                        });
                    });
                    return changed ? updated : prev;
                });
            };
            const updateNodeNote = (nid, noteText) => {
                setNodes(prev => ({ ...prev, [activeId]: (prev[activeId] || []).map(n => n.id === nid ? { ...n, note: noteText } : n) }));
            };
            const toggleAllNodes = (min) => setNodes(prev => ({ ...prev, [activeId]: (prev[activeId] || []).map(n => ({ ...n, isMinimized: min })) }));
            const handleDownloadNodes = () => { /* Node download logic same as v9.5 */
                if (!activeId || !nodes[activeId] || nodes[activeId].length === 0) return alert("데이터가 없습니다.");
                const currentDoc = history.find(h => h.id === activeId);
                const title = currentDoc.metadata?.title || currentDoc.filename;
                const link = document.createElement("a");
                let html = `<html><body><h2>${title}</h2><table border='1'><tr><th>Code</th><th>Orig</th><th>APA</th><th>Memo</th></tr>`;
                nodes[activeId].forEach(n => html += `<tr><td>${n.code}</td><td>${n.original}</td><td>${n.apa}</td><td>${n.note || ""}</td></tr>`);
                link.href = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(html + "</table></body></html>");
                link.download = `${title}_질적코딩.doc`; link.click();
            };

            React.useEffect(() => {
                if (!classifyProjId) return;
                const projFiles = history.filter(h => h.projectId === classifyProjId);
                if (!projFiles.length) return;
                const projFileIds = new Set(projFiles.map(f => f.id));
                setClassifyData(prev => {
                    const pillars = prev[classifyProjId] || [];
                    if (!pillars.length) return prev;
                    let changed = false;
                    const nextPillars = [];
                    pillars.forEach((p) => {
                        if (!p.isSource || !projFileIds.has(p.id)) {
                            nextPillars.push(p);
                            return;
                        }
                        const fileNodes = nodes[p.id] || [];
                        if (!fileNodes.length) {
                            changed = true;
                            return;
                        }
                        const prevNodes = p.nodes || [];
                        const prevMap = new Map(prevNodes.map(n => [n.id, n]));
                        const rebuilt = fileNodes.map(n => {
                            const old = prevMap.get(n.id);
                            return {
                                id: n.id,
                                text: n.original,
                                code: n.code,
                                apa: n.apa,
                                type: old?.type || "Node",
                                time: old?.time || new Date().toLocaleTimeString()
                            };
                        });
                        const same = rebuilt.length === prevNodes.length && rebuilt.every((n, idx) => {
                            const o = prevNodes[idx];
                            return o && o.id === n.id && o.text === n.text && o.code === n.code && o.apa === n.apa && o.type === n.type;
                        });
                        if (same) {
                            nextPillars.push(p);
                            return;
                        }
                        changed = true;
                        nextPillars.push({ ...p, nodes: rebuilt });
                    });
                    return changed ? { ...prev, [classifyProjId]: nextPillars } : prev;
                });
            }, [nodes, history, classifyProjId]);

            React.useEffect(() => {
                if (!classifyProjId) return;
                if (classifyLayoutMode[classifyProjId] !== "horizontal") return;
                const projectKey = makeTheoryProjectKey(classifyProjId);
                setActiveTheoryKey(projectKey);
                setTheoryDrafts(prev => {
                    const current = prev[projectKey];
                    if (!current?.bodyHtml) return prev;
                    const rebuiltHtml = rebuildTheoryDocHtml(classifyProjId, current.bodyHtml, {});
                    if (rebuiltHtml === current.bodyHtml) return prev;
                    return {
                        ...prev,
                        [projectKey]: {
                            ...current,
                            bodyHtml: rebuiltHtml,
                            body: htmlToPlainText(rebuiltHtml)
                        }
                    };
                });
            }, [classifyProjId, classifyLayoutMode, classifyData]);

            // [NEW] Cancel Translation
            const handleCancelTranslation = (e, tempId) => {
                e.stopPropagation();
                if (confirm("번역을 취소하시겠습니까?")) {
                    cancelledRef.current.add(tempId);
                    setQueue(p => p.filter(q => q.tempId !== tempId));
                    if (activeId === tempId) setActiveId(null);
                }
            };

            const classifyPillars = classifyProjId ? (classifyData[classifyProjId] || []) : [];
            const hasCoreSentencePillars = classifyPillars.some((pillar) => pillar.isSource);
            const hasQualitativePillars = classifyPillars.some((pillar) => !pillar.isSource);
            const isHorizontalClassify = classifyProjId ? classifyLayoutMode[classifyProjId] === "horizontal" : false;
            const horizontalPillars = classifyPillars.filter(p => !p.isSource);
            const theoryProjectKey = classifyProjId ? makeTheoryProjectKey(classifyProjId) : null;
            const activeReferencePeekPanels = activeId ? (referencePeekPanelsByDoc[activeId] || []) : [];
            const networkBaseGraphData = React.useMemo(() => {
                const docs = Array.isArray(history) ? history : [];
                const projectList = Array.isArray(projects) ? projects : [];
                const panelsStore = (referencePeekPanelsByDoc && typeof referencePeekPanelsByDoc === "object") ? referencePeekPanelsByDoc : {};
                const normalizeToken = (value = "") => compactText(value).toLowerCase().replace(/[^0-9a-z가-힣]+/gi, " ").trim();
                const isReferenceMappingFail = (value = "") => /^매핑된 레퍼런스를 찾지 못했습니다\./.test(String(value || "").trim());
                const docById = new Map();
                const docNameById = new Map();
                docs.forEach((doc, idx) => {
                    const docId = String(doc?.id || "");
                    if (!docId) return;
                    docById.set(docId, doc);
                    docNameById.set(docId, compactText(doc?.filename || doc?.metadata?.title || `문서 ${idx + 1}`) || `문서 ${idx + 1}`);
                });
                const hubMap = new Map();
                const hubOrder = [];
                const ensureHub = (id, projectId, label) => {
                    if (!hubMap.has(id)) {
                        hubMap.set(id, {
                            id,
                            nodeType: "project",
                            projectId,
                            label,
                            docIdsSet: new Set(),
                            oneHopKeysSet: new Set(),
                            x: 0,
                            y: 0
                        });
                        hubOrder.push(id);
                    }
                    return hubMap.get(id);
                };
                const projectNameById = new Map(
                    projectList.map((project, idx) => {
                        const projectId = String(project?.id || "");
                        const projectName = compactText(project?.name || `프로젝트 ${idx + 1}`) || `프로젝트 ${idx + 1}`;
                        return [projectId, projectName];
                    })
                );
                projectList.forEach((project, idx) => {
                    const projectId = String(project?.id || "");
                    if (!projectId) return;
                    ensureHub(`hub-project-${projectId}`, projectId, compactText(project?.name || `프로젝트 ${idx + 1}`) || `프로젝트 ${idx + 1}`);
                });
                const ensureUncategorizedHub = () => ensureHub("hub-project-uncategorized", null, "미분류");
                const resolveHubForDoc = (doc) => {
                    const rawProjectId = doc?.projectId;
                    const projectId = (rawProjectId === null || rawProjectId === undefined || rawProjectId === "") ? null : String(rawProjectId);
                    if (projectId && projectNameById.has(projectId)) {
                        return ensureHub(`hub-project-${projectId}`, projectId, projectNameById.get(projectId));
                    }
                    return ensureUncategorizedHub();
                };
                const oneHopMap = new Map();
                const docToOneHopKey = new Map();
                docs.forEach((doc, idx) => {
                    const docId = String(doc?.id || "");
                    if (!docId) return;
                    const hub = resolveHubForDoc(doc);
                    const metadata = (doc?.metadata && typeof doc.metadata === "object") ? doc.metadata : {};
                    const author = compactText(metadata.author || "Unknown") || "Unknown";
                    const title = compactText(metadata.title || doc?.filename || `문서 ${idx + 1}`) || `문서 ${idx + 1}`;
                    const yearRaw = compactText(metadata.year || "");
                    const yearMatch = yearRaw.match(/\b(19|20)\d{2}\b/);
                    const year = yearMatch ? yearMatch[0] : (yearRaw || "n.d.");
                    const normalizedTitle = normalizeToken(title);
                    const mergeKey = normalizedTitle.length < 6
                        ? `doc:${docId}`
                        : `${normalizeToken(author) || "unknown"}|${normalizedTitle}|${normalizeToken(year) || "nd"}`;
                    const label = `${author}, ${title}, ${year}`;
                    if (!oneHopMap.has(mergeKey)) {
                        oneHopMap.set(mergeKey, {
                            id: "",
                            nodeType: "onehop",
                            mergeKey,
                            label,
                            author,
                            title,
                            year,
                            projectHubIdsSet: new Set(),
                            docIdsSet: new Set(),
                            docRowsMap: new Map(),
                            twoHopKeysSet: new Set(),
                            projectHitCount: {},
                            x: 0,
                            y: 0,
                            primaryHubId: ""
                        });
                    }
                    const oneHop = oneHopMap.get(mergeKey);
                    oneHop.projectHubIdsSet.add(hub.id);
                    oneHop.docIdsSet.add(docId);
                    oneHop.projectHitCount[hub.id] = Number(oneHop.projectHitCount[hub.id] || 0) + 1;
                    if (!oneHop.docRowsMap.has(docId)) {
                        const analysisObj = normalizeAnalysisObject(doc?.analysis);
                        oneHop.docRowsMap.set(docId, {
                            docId,
                            filename: compactText(doc?.filename || doc?.metadata?.title || `문서 ${docId}`) || `문서 ${docId}`,
                            projectName: hub.label || "미분류",
                            bibliograph: compactText(getBibliographValue(doc, analysisObj) || buildBibliographLineFromDoc(doc) || ""),
                            docTitle: compactText(doc?.metadata?.title || doc?.filename || "")
                        });
                    }
                    hub.docIdsSet.add(docId);
                    hub.oneHopKeysSet.add(mergeKey);
                    docToOneHopKey.set(docId, mergeKey);
                });
                const twoHopMap = new Map();
                Object.entries(panelsStore).forEach(([rawDocId, panels]) => {
                    if (!Array.isArray(panels) || panels.length === 0) return;
                    const docId = String(rawDocId || "");
                    if (!docId || !docById.has(docId)) return;
                    const oneHopKey = docToOneHopKey.get(docId);
                    if (!oneHopKey || !oneHopMap.has(oneHopKey)) return;
                    const oneHop = oneHopMap.get(oneHopKey);
                    const docName = docNameById.get(docId) || `문서 ${docId}`;
                    panels.forEach((panel) => {
                        const referenceLine = compactText(panel?.referenceLine || "");
                        if (!referenceLine || isReferenceMappingFail(referenceLine)) return;
                        const cacheKey = String(panel?.cacheKey || "").trim();
                        const fallbackKey = normalizeToken(referenceLine);
                        const mergeKey = cacheKey || (fallbackKey ? `line:${fallbackKey}` : "");
                        if (!mergeKey) return;
                        const citeNo = String(panel?.citeNo || "").trim();
                        const source = compactText(panel?.source || "");
                        const abstractText = compactText(panel?.abstractText || "");
                        const savedAt = String(panel?.savedAt || "").trim();
                        const parsed = parseReferenceAuthorYearLabel(referenceLine);
                        const scholarFallback = String(panel?.scholarUrl || "").trim() || `https://scholar.google.com/scholar?q=${encodeURIComponent(buildScholarQueryText(referenceLine) || referenceLine)}`;
                        if (!twoHopMap.has(mergeKey)) {
                            twoHopMap.set(mergeKey, {
                                id: "",
                                nodeType: "twohop",
                                mergeKey,
                                label: parsed.label || "Unknown(n.d.)",
                                referenceLine,
                                abstractText,
                                source,
                                savedAt,
                                openAlexUrl: String(panel?.openAlexUrl || "").trim(),
                                doiUrl: String(panel?.doiUrl || "").trim(),
                                arxivUrl: String(panel?.arxivUrl || "").trim(),
                                scholarUrl: scholarFallback,
                                docIdsSet: new Set([docId]),
                                docNamesSet: new Set([docName]),
                                citeNosSet: citeNo ? new Set([citeNo]) : new Set(),
                                oneHopKeysSet: new Set([oneHopKey]),
                                x: 0,
                                y: 0,
                                oneHopIds: [],
                                primaryOneHopId: ""
                            });
                        } else {
                            const existing = twoHopMap.get(mergeKey);
                            if (referenceLine.length > String(existing.referenceLine || "").length) existing.referenceLine = referenceLine;
                            if (abstractText.length > String(existing.abstractText || "").length) existing.abstractText = abstractText;
                            if (!existing.source && source) existing.source = source;
                            const prevTs = Date.parse(existing.savedAt || "");
                            const nextTs = Date.parse(savedAt || "");
                            if (Number.isFinite(nextTs) && (!Number.isFinite(prevTs) || nextTs > prevTs)) existing.savedAt = savedAt;
                            if (!existing.openAlexUrl) existing.openAlexUrl = String(panel?.openAlexUrl || "").trim();
                            if (!existing.doiUrl) existing.doiUrl = String(panel?.doiUrl || "").trim();
                            if (!existing.arxivUrl) existing.arxivUrl = String(panel?.arxivUrl || "").trim();
                            if (!existing.scholarUrl) existing.scholarUrl = scholarFallback;
                            if (citeNo) existing.citeNosSet.add(citeNo);
                            existing.docIdsSet.add(docId);
                            existing.docNamesSet.add(docName);
                            existing.oneHopKeysSet.add(oneHopKey);
                        }
                        oneHop.twoHopKeysSet.add(mergeKey);
                    });
                });
                const projectHubs = hubOrder
                    .map((hubId) => hubMap.get(hubId))
                    .filter(Boolean)
                    .map((hub) => ({
                        id: hub.id,
                        nodeType: "project",
                        projectId: hub.projectId,
                        label: hub.label,
                        docIds: Array.from(hub.docIdsSet),
                        oneHopKeys: Array.from(hub.oneHopKeysSet),
                        docCount: hub.docIdsSet.size,
                        oneHopCount: hub.oneHopKeysSet.size,
                        x: 0,
                        y: 0
